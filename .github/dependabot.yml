version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-minor-patch: { update-types: [minor, patch] }
    ignore:
      # TypeScript 7 (native compiler) does not build the project yet; revisit deliberately.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Stay on Node.js LTS releases (even majors); odd majors are short-lived.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
