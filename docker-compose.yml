# Using Portainer or another UI without a shell? Use docker-compose.portainer.yml instead.
services:
  mailroutine:
    image: ghcr.io/geshas/mailroutine:latest
    # To build from source instead of pulling the published image:
    #   docker compose up -d --build   (uncomment the next two lines)
    # build:
    #   context: .
    container_name: mailroutine
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    volumes:
      - ./data:/data

    healthcheck:
      test:
        - CMD
        - /app/mailroutine
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
